<text x="64" y="55.0" font-family="Courier New, Courier, monospace" font-size="15" fill="#141414" xml:space="preserve">Mail-from: DEC-MARLBORO rcvd at 3-May-78 0955-PDT</text>
<text x="64" y="78.2" font-family="Courier New, Courier, monospace" font-size="15" fill="#141414" xml:space="preserve">Date:  1 May 1978 1233-EDT</text>
<text x="64" y="101.5" font-family="Courier New, Courier, monospace" font-size="15" fill="#141414" xml:space="preserve">From: THUERK at DEC-MARLBORO</text>
<text x="64" y="124.8" font-family="Courier New, Courier, monospace" font-size="15" fill="#141414" xml:space="preserve">Subject: ADRIAN@SRI-KL</text>
<text x="64" y="148.0" font-family="Courier New, Courier, monospace" font-size="15" fill="#141414" xml:space="preserve">To:   DDAY at SRI-KL, DAY at SRI-KL, DEBOER at UCLA-CCN,</text>
<text x="64" y="171.2" font-family="Courier New, Courier, monospace" font-size="15" fill="#141414" xml:space="preserve">To:   WASHDC at SRI-KL, LOGICON at USC-ISI, SDAC at USC-ISI,</text>
<text x="64" y="194.5" font-family="Courier New, Courier, monospace" font-size="15" fill="#141414" xml:space="preserve">To:   DELDO at USC-ISI, DELEOT at USC-ISI, DELFINO at USC-ISI,</text>
<text x="64" y="217.8" font-family="Courier New, Courier, monospace" font-size="15" fill="#141414" xml:space="preserve">To:   DENICOFF at USC-ISI, DESPAIN at USC-ISI, DEUTSCH at SRI-KL,</text>
<text x="64" y="241.0" font-family="Courier New, Courier, monospace" font-size="15" fill="#141414" xml:space="preserve">To:   DEUTSCH at PARC-MAXC, EMY at CCA-TENEX, DIETER at USC-ISIB,</text>
<text x="64" y="264.2" font-family="Courier New, Courier, monospace" font-size="15" fill="#8a857a" font-style="italic" xml:space="preserve">[ 119 Zeilen Empfänger; danach lief das Adressfeld über ]</text>
<text x="64" y="287.5" font-family="Courier New, Courier, monospace" font-size="15" fill="#141414" xml:space="preserve">cc:   BPM at SU-AI</text>
<text x="64" y="334.0" font-family="Courier New, Courier, monospace" font-size="15" fill="#141414" xml:space="preserve">DIGITAL WILL BE GIVING A PRODUCT PRESENTATION OF THE NEWEST MEMBERS OF THE</text>
<text x="64" y="357.2" font-family="Courier New, Courier, monospace" font-size="15" fill="#141414" xml:space="preserve">DECSYSTEM-20 FAMILY; THE DECSYSTEM-2020, 2020T, 2060, AND 2060T.  THE</text>
<text x="64" y="380.5" font-family="Courier New, Courier, monospace" font-size="15" fill="#141414" xml:space="preserve">DECSYSTEM-20 FAMILY OF COMPUTERS HAS EVOLVED FROM THE TENEX OPERATING SYSTEM</text>
<text x="64" y="403.8" font-family="Courier New, Courier, monospace" font-size="15" fill="#141414" xml:space="preserve">AND THE DECSYSTEM-10 &lt;PDP-10&gt; COMPUTER ARCHITECTURE.  BOTH THE DECSYSTEM-2060T</text>
<text x="64" y="427.0" font-family="Courier New, Courier, monospace" font-size="15" fill="#141414" xml:space="preserve">AND 2020T OFFER FULL ARPANET SUPPORT UNDER THE TOPS-20 OPERATING SYSTEM.</text>
<text x="64" y="473.5" font-family="Courier New, Courier, monospace" font-size="15" fill="#141414" xml:space="preserve">WE INVITE YOU TO COME SEE THE 2020 AND HEAR ABOUT THE DECSYSTEM-20 FAMILY</text>
<text x="64" y="496.8" font-family="Courier New, Courier, monospace" font-size="15" fill="#141414" xml:space="preserve">AT THE TWO PRODUCT PRESENTATIONS WE WILL BE GIVING IN CALIFORNIA THIS</text>
<text x="64" y="520.0" font-family="Courier New, Courier, monospace" font-size="15" fill="#141414" xml:space="preserve">MONTH.  THE LOCATIONS WILL BE:</text>
<text x="64" y="566.5" font-family="Courier New, Courier, monospace" font-size="15" fill="#141414" xml:space="preserve">               TUESDAY, MAY 9, 1978 - 2 PM</text>
<text x="64" y="589.8" font-family="Courier New, Courier, monospace" font-size="15" fill="#141414" xml:space="preserve">                   HYATT HOUSE (NEAR THE L.A. AIRPORT)</text>
<text x="64" y="613.0" font-family="Courier New, Courier, monospace" font-size="15" fill="#141414" xml:space="preserve">                   LOS ANGELES, CA</text>
<text x="64" y="659.5" font-family="Courier New, Courier, monospace" font-size="15" fill="#141414" xml:space="preserve">               THURSDAY, MAY 11, 1978 - 2 PM</text>
<text x="64" y="682.8" font-family="Courier New, Courier, monospace" font-size="15" fill="#141414" xml:space="preserve">                   DUNFEY&#x27;S ROYAL COACH</text>
<text x="64" y="706.0" font-family="Courier New, Courier, monospace" font-size="15" fill="#141414" xml:space="preserve">                   SAN MATEO, CA</text>
<text x="64" y="729.2" font-family="Courier New, Courier, monospace" font-size="15" fill="#141414" xml:space="preserve">                   (4 MILES SOUTH OF S.F. AIRPORT AT BAYSHORE, RT 101 AND RT 92)</text>
<text x="64" y="775.8" font-family="Courier New, Courier, monospace" font-size="15" fill="#141414" xml:space="preserve">A 2020 WILL BE THERE FOR YOU TO VIEW. ALSO TERMINALS ON-LINE TO OTHER</text>
<text x="64" y="799.0" font-family="Courier New, Courier, monospace" font-size="15" fill="#141414" xml:space="preserve">DECSYSTEM-20 SYSTEMS THROUGH THE ARPANET. IF YOU ARE UNABLE TO ATTEND,</text>
<text x="64" y="822.2" font-family="Courier New, Courier, monospace" font-size="15" fill="#141414" xml:space="preserve">PLEASE FEEL FREE TO CONTACT THE NEAREST DEC OFFICE</text>
<text x="64" y="845.5" font-family="Courier New, Courier, monospace" font-size="15" fill="#141414" xml:space="preserve">FOR MORE INFORMATION ABOUT THE EXCITING DECSYSTEM-20 FAMILY.</text>
</svg>